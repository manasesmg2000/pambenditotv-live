name: Detectar Directo YouTube

on:
  schedule:
    - cron: '*/5 * * * *'   # cada 5 minutos
  workflow_dispatch:          # permite ejecutarlo manualmente

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Comprobar si hay directo en YouTube
        id: check
        run: |
          CHANNEL_URL="https://www.youtube.com/@pambenditoTV/live"
          
          # Descargamos la pagina del directo con User-Agent de navegador
          RESPONSE=$(curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/120 Safari/537.36" \
            -H "Accept-Language: es-ES,es;q=0.9" \
            "$CHANNEL_URL")
          
          # Buscamos el videoId en la respuesta
          VIDEO_ID=$(echo "$RESPONSE" | grep -oP '"videoId":"[^"]{11}"' | head -1 | grep -oP '(?<="videoId":")[^"]+')
          
          # Verificamos que hay liveBroadcastContent: live
          IS_LIVE=$(echo "$RESPONSE" | grep -c '"liveBroadcastContent":"live"' || true)
          
          TITLE=""
          if [ -n "$VIDEO_ID" ] && [ "$IS_LIVE" -gt "0" ]; then
            echo "LIVE=true" >> $GITHUB_OUTPUT
            echo "VIDEO_ID=$VIDEO_ID" >> $GITHUB_OUTPUT
            # Intentamos obtener el titulo
            TITLE=$(echo "$RESPONSE" | grep -oP '"title":"[^"]*"' | head -1 | sed 's/"title":"//;s/"//')
            echo "TITLE=$TITLE" >> $GITHUB_OUTPUT
            echo ">>> DIRECTO DETECTADO: $VIDEO_ID"
          else
            echo "LIVE=false" >> $GITHUB_OUTPUT
            echo "VIDEO_ID=" >> $GITHUB_OUTPUT
            echo "TITLE=" >> $GITHUB_OUTPUT
            echo ">>> Sin directo actualmente"
          fi

      - name: Actualizar status.json
        run: |
          LIVE="${{ steps.check.outputs.LIVE }}"
          VIDEO_ID="${{ steps.check.outputs.VIDEO_ID }}"
          TITLE="${{ steps.check.outputs.TITLE }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          if [ "$LIVE" = "true" ]; then
            echo "{\"live\": true, \"videoId\": \"$VIDEO_ID\", \"title\": \"$TITLE\", \"updatedAt\": \"$TIMESTAMP\"}" > status.json
          else
            echo "{\"live\": false, \"videoId\": null, \"title\": \"\", \"updatedAt\": \"$TIMESTAMP\"}" > status.json
          fi
          
          cat status.json

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --staged --quiet; then
            echo "Sin cambios en status.json"
          else
            git commit -m "bot: actualizar estado del directo [$(date -u +'%H:%M UTC')]"
            git push
            echo "Status.json actualizado y subido"
          fi
