name: Detectar Directo YouTube

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Comprobar si hay directo en YouTube
        id: check
        run: |
          CHANNEL_ID="UC41gFAr8NZwdUYkmRtYFNgw"
          
          echo ">>> Obteniendo videos recientes del RSS feed..."
          RSS=$(curl -sL \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            "https://www.youtube.com/feeds/videos.xml?channel_id=$CHANNEL_ID")
          
          # Extraer los ultimos 5 IDs de video del RSS
          VIDEO_IDS=$(echo "$RSS" | grep -oP '(?<=<yt:videoId>)[^<]+' | head -5)
          echo "Videos a comprobar: $VIDEO_IDS"
          
          LIVE_VIDEO_ID=""
          LIVE_TITLE=""
          
          for VID in $VIDEO_IDS; do
            echo ">>> Comprobando video: $VID"
            PAGE=$(curl -sL \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept-Language: es-ES,es;q=0.9,en;q=0.8" \
              "https://www.youtube.com/watch?v=$VID")
            
            if echo "$PAGE" | grep -q '"liveBroadcastContent":"live"'; then
              echo ">>> DIRECTO DETECTADO: $VID"
              LIVE_VIDEO_ID="$VID"
              LIVE_TITLE=$(echo "$PAGE" | grep -oP '"title":\{"runs":\[.*?\{"text":"[^"]*"' | grep -oP '(?<="text":")[^"]+' | head -1 || echo "")
              break
            else
              echo "    No es directo: $VID"
            fi
          done
          
          if [ -n "$LIVE_VIDEO_ID" ]; then
            echo "LIVE=true"        >> $GITHUB_OUTPUT
            echo "VIDEO_ID=$LIVE_VIDEO_ID" >> $GITHUB_OUTPUT
            echo "TITLE=$LIVE_TITLE"      >> $GITHUB_OUTPUT
          else
            echo "LIVE=false"       >> $GITHUB_OUTPUT
            echo "VIDEO_ID="        >> $GITHUB_OUTPUT
            echo "TITLE="           >> $GITHUB_OUTPUT
          fi

      - name: Actualizar status.json
        run: |
          LIVE="${{ steps.check.outputs.LIVE }}"
          VIDEO_ID="${{ steps.check.outputs.VIDEO_ID }}"
          TITLE="${{ steps.check.outputs.TITLE }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          if [ "$LIVE" = "true" ]; then
            printf '{"live": true, "videoId": "%s", "title": "%s", "updatedAt": "%s"}' \
              "$VIDEO_ID" "$TITLE" "$TIMESTAMP" > status.json
          else
            printf '{"live": false, "videoId": null, "title": "", "updatedAt": "%s"}' \
              "$TIMESTAMP" > status.json
          fi
          
          echo ">>> status.json actualizado:"
          cat status.json

      - name: Commit y push si hay cambios
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --staged --quiet; then
            echo "Sin cambios en status.json"
          else
            git commit -m "bot: estado del directo [$(date -u +'%H:%M UTC')]"
            git push
          fi
